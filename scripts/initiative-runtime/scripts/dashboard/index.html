<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vizor · Live queue</title>
    <link rel="stylesheet" href="/dashboard.css" />
    <script type="module" src="/dashboard.js"></script>
  </head>
  <body>
    <header class="masthead">
      <div class="wordmark">
        <span class="mark" aria-hidden="true">V</span> Vizor
      </div>
      <a id="repository" class="repository" target="_blank" rel="noopener"></a>
    </header>
    <main>
      <div class="headline">
        <h1>Live queue</h1>
        <div class="queue-meta">
          <span id="queue-state" class="badge">Connecting</span
          ><span id="updated"></span>
        </div>
      </div>
      <p id="notice" class="notice" role="status">Reading the live queue…</p>
      <section aria-labelledby="agents-title" id="agent-section" hidden>
        <h2 id="agents-title">Agents</h2>
        <div class="agents" id="agents"></div>
      </section>
      <section aria-labelledby="tasks-title" id="task-section" hidden>
        <div class="section-head">
          <h2 id="tasks-title">Tasks</h2>
          <div class="filters" aria-label="Filter tasks">
            <button data-filter="remaining" type="button" aria-pressed="true">
              Remaining
            </button>
            <button data-filter="attention" type="button" aria-pressed="false">
              Needs attention
            </button>
            <button data-filter="all" type="button" aria-pressed="false">
              All
            </button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">Task</th>
                <th scope="col">Agent</th>
                <th scope="col">Status</th>
                <th scope="col">What happens next</th>
              </tr>
            </thead>
            <tbody id="tasks"></tbody>
          </table>
        </div>
      </section>
      <section id="blocker-section" aria-labelledby="blocker-title" hidden>
        <h2 id="blocker-title">Blocker investigations</h2>
        <div id="blockers"></div>
        <h3>Activity</h3>
        <ol id="blocker-activity"></ol>
      </section>
    </main>
  </body>
</html>
