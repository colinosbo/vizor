<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>Opening Vizor</title>
    <link rel="stylesheet" href="intro.css" />
    <script src="intro.js" defer></script>
  </head>
  <body>
    <main class="intro" aria-label="Opening Vizor">
      <div class="scene" aria-hidden="true">
        <svg
          class="comets"
          viewBox="0 0 320 320"
          xmlns="http://www.w3.org/2000/svg"
        >
          <defs>
            <linearGradient id="comet-color">
              <stop stop-color="#e98b57" stop-opacity="0" />
              <stop offset="1" stop-color="#ffc592" />
            </linearGradient>
          </defs>
          <g class="comet comet-a">
            <path d="M40 160a120 120 0 0 1 120-120" />
            <circle cx="160" cy="40" r="2.5" />
          </g>
          <g class="comet comet-b">
            <path d="M40 160a120 120 0 0 1 120-120" />
            <circle cx="160" cy="40" r="2" />
          </g>
          <g class="comet comet-c">
            <path d="M40 160a120 120 0 0 1 120-120" />
            <circle cx="160" cy="40" r="1.5" />
          </g>
        </svg>
        <div class="sparks"></div>
        <div class="lock-ripple"></div>
        <div class="echo-ripple"></div>
        <svg
          class="accent-orbits"
          viewBox="0 0 320 320"
          xmlns="http://www.w3.org/2000/svg"
        >
          <g class="accent-orbit">
            <circle cx="160" cy="160" r="171" />
            <circle cx="160" cy="160" r="119" />
          </g>
          <g class="satellites">
            <path
              d="M160 -19l4 7-4 7-4-7zM339 160l-7 4-7-4 7-4zM160 339l-4-7 4-7 4 7zM-19 160l7-4 7 4-7 4z"
            />
          </g>
        </svg>
        <svg
          class="starburst"
          viewBox="0 0 320 320"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path d="M160 90v140M90 160h140M128 128l64 64M128 192l64-64" />
        </svg>
        <div class="orbit orbit-one"></div>
        <div class="orbit orbit-two"></div>
        <div class="mascot">
          <svg
            class="clawd"
            viewBox="0 0 180 120"
            xmlns="http://www.w3.org/2000/svg"
          >
            <defs>
              <linearGradient
                id="clawd-orange"
                gradientUnits="userSpaceOnUse"
                x1="20"
                y1="5"
                x2="160"
                y2="115"
              >
                <stop stop-color="#ffd09a" />
                <stop offset="0.28" stop-color="#ffa257" />
                <stop offset="0.62" stop-color="#f27d38" />
                <stop offset="1" stop-color="#b94223" />
              </linearGradient>
              <linearGradient id="clawd-sheen">
                <stop stop-color="#fff2d6" stop-opacity="0" />
                <stop offset="0.5" stop-color="#fff2d6" stop-opacity="0.6" />
                <stop offset="1" stop-color="#fff2d6" stop-opacity="0" />
              </linearGradient>
              <path
                id="clawd-outline"
                d="M30 5H150V15H160V25H170V65H180V95H170V85H160V95H150V115H130V95H120V115H100V95H80V115H60V95H50V115H30V95H20V85H10V95H0V65H10V25H20V15H30Z"
              />
              <clipPath id="clawd-clip"><use href="#clawd-outline" /></clipPath>
            </defs>
            <g class="pixels"></g>
            <use
              class="body-shape"
              href="#clawd-outline"
              fill="url(#clawd-orange)"
            />
            <g clip-path="url(#clawd-clip)">
              <path
                class="sheen"
                d="M-110 0H-65L-5 120H-50Z"
                fill="url(#clawd-sheen)"
              />
            </g>
            <use class="body-rim" href="#clawd-outline" />
            <g class="eyes" fill="#241c18">
              <path d="M55 38h10v25H55zM115 38h10v25h-10z" />
            </g>
          </svg>
          <div class="ground"></div>
        </div>
        <div class="scope">
          <svg
            class="reticle"
            viewBox="0 0 320 320"
            xmlns="http://www.w3.org/2000/svg"
          >
            <circle class="scope-outer" cx="160" cy="160" r="143" />
            <circle class="scope-inner" cx="160" cy="160" r="133" />
            <circle class="scope-track" cx="160" cy="160" r="153" />
            <g class="scope-ticks">
              <path d="M160 10v30M310 160h-30M160 310v-30M10 160h30" />
            </g>
            <g class="scope-guides">
              <path d="M160 48v12M272 160h-12M160 272v-12M48 160h12" />
            </g>
          </svg>
          <span class="lock-corner corner-a"></span
          ><span class="lock-corner corner-b"></span>
          <span class="lock-corner corner-c"></span
          ><span class="lock-corner corner-d"></span>
          <span class="scope-label">IN FOCUS</span>
        </div>
      </div>
      <div class="identity">
        <h1>vizor<span>.</span></h1>
        <p role="status" aria-live="polite">Finding your focus</p>
      </div>
    </main>
  </body>
</html>
